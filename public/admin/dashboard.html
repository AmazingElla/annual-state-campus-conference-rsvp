<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organiser Dashboard · Campus Sisters Conference</title><link rel="stylesheet" href="/theme.css"><script src="/admin.js" defer></script></head><body style="background:#eee7dc"><header style="background:#090909;color:white;padding:22px"><div style="max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px"><div><div class="eyebrow gold">Organiser access only</div><h1 class="sans" style="margin:6px 0;font-size:1.5rem">Conference dashboard</h1></div><a href="/" style="color:var(--gold);font:700 .8rem Arial">View public page ↗</a></div></header><main style="max-width:1250px;margin:auto;padding:30px 18px"><div id="notice" class="toast" style="display:none"></div><section id="stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0"></section><section class="panel" style="padding:22px;margin:22px 0"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2 class="sans">Registrations</h2><button class="btn" id="export-reg">Export registrations CSV</button></div><div style="overflow:auto"><table id="reg-table" class="sans" style="border-collapse:collapse;width:100%;font-size:.82rem"></table></div></section><section class="panel" style="padding:22px;margin:22px 0"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2 class="sans">Contributions</h2><button class="btn" id="export-con">Export contributions CSV</button></div><div style="overflow:auto"><table id="con-table" class="sans" style="border-collapse:collapse;width:100%;font-size:.82rem"></table></div></section></main></body></html>
